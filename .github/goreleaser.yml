# test this file with
#   goreleaser release --config goreleaser.yml --clean --snapshot
version: 2
builds:
  - id: chisel
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/jpillora/chisel/share.BuildVersion={{.Version}}
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
      - openbsd
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - ppc64
      - ppc64le
      - mips
      - mipsle
      - mips64
      - mips64le
      - s390x
    goarm:
      - "5"
      - "6"
      - "7"
    gomips:
      - hardfloat
      - softfloat
    ignore:
      # https://github.com/golang/go/issues/70705
      - goos: windows
        goarch: arm
nfpms:
  - maintainer: "https://github.com/jpillora"
    formats:
      - deb
      - rpm
      - apk
archives:
  - formats:
      - gz
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*
checksum:
  # The publishing workflow stages preflight-verified archives outside dist,
  # then sets this glob so the real release checksums those exact files.
  # Empty by default so normal local/snapshot releases keep standard behavior.
  extra_files:
    - glob: '{{ envOrDefault "RELEASE_ARCHIVES_GLOB" "" }}'
release:
  draft: true
  replace_existing_draft: true
  prerelease: auto
  # In CI, these are the archives produced and checked by the non-publishing
  # preflight. The publishing run uses --skip=archive, so it cannot replace
  # them with rebuilt, unvalidated archives.
  extra_files:
    - glob: '{{ envOrDefault "RELEASE_ARCHIVES_GLOB" "" }}'
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# ko builds and publishes the versioned multi-arch index directly. Its local
# registry serves a six-platform scratch base containing only CA roots; CI
# builds it from .github/ko-base.Dockerfile before the publishing run.
# Floating tags (latest / X / X.Y) are still promoted only when the draft
# GitHub release is published (release stage 2).
kos:
  - id: chisel
    build: chisel
    main: .
    repositories:
      - ghcr.io/jpillora/chisel
      - docker.io/jpillora/chisel
    tags:
      - "{{ .Version }}"
    base_image: localhost:5000/chisel-ko-base:local
    user: "0"
    bare: true
    preserve_import_paths: false
    creation_time: "{{ .CommitTimestamp }}"
    sbom: spdx
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/ppc64le
      - linux/386
      - linux/arm/v7
      - linux/arm/v6
