# test this file with
#   goreleaser release --config goreleaser.yml --clean --snapshot
version: 2
builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/jpillora/chisel/share.BuildVersion={{.Version}}
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
      - openbsd
    goarch:
      - 386
      - amd64
      - arm
      - arm64
      - ppc64
      - ppc64le
      - mips
      - mipsle
      - mips64
      - mips64le
      - s390x
    goarm:
      - 5
      - 6
      - 7
    gomips:
      - hardfloat
      - softfloat
nfpms:
  - maintainer: "https://github.com/{{ .Env.GITHUB_USER }}"
    formats:
      - deb
      - rpm
      - apk
archives:
  - format: gz
    files:
      - none*
checksum:
  # The publishing workflow stages preflight-verified archives outside dist,
  # then sets this glob so the real release checksums those exact files.
  # Empty by default so normal local/snapshot releases keep standard behavior.
  extra_files:
    - glob: '{{ envOrDefault "RELEASE_ARCHIVES_GLOB" "" }}'
release:
  draft: true
  replace_existing_draft: true
  prerelease: auto
  # In CI, these are the archives produced and checked by the non-publishing
  # preflight. The publishing run uses --skip=archive, so it cannot replace
  # them with rebuilt, unvalidated archives.
  extra_files:
    - glob: '{{ envOrDefault "RELEASE_ARCHIVES_GLOB" "" }}'
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"